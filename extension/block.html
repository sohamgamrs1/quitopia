<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blocked — Quitopia</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #0B3B2E;
    background-image:
      radial-gradient(800px 500px at 15% -10%, rgba(168,230,207,.18), transparent 60%),
      radial-gradient(700px 420px at 100% 10%, rgba(217,164,122,.12), transparent 55%);
    color: #FDFBF6; letter-spacing: -0.01em;
  }
  .card { max-width: 440px; text-align: center; }
  .ring {
    width: 168px; height: 168px; margin: 0 auto 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 45%, rgba(168,230,207,.28), rgba(168,230,207,.06));
    border: 1.5px solid rgba(168,230,207,.45);
    animation: breathe 8s ease-in-out infinite;
  }
  .ring span { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  @keyframes breathe {
    0%, 100% { transform: scale(.92); }
    50% { transform: scale(1.04); }
  }
  h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -0.035em; font-weight: 800; }
  p { margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: rgba(253,251,246,.72); }
  .host {
    display: inline-block; margin: 14px 0 4px; padding: 6px 14px; border-radius: 999px;
    background: rgba(253,251,246,.10); font-size: 12.5px; font-weight: 600;
    color: #FDFBF6; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a.btn {
    border: 0; border-radius: 999px; padding: 13px 26px; font: inherit; font-weight: 700;
    font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block;
    transition: opacity .18s, background .18s;
  }
  .primary { background: #A8E6CF; color: #0B3B2E; }
  .primary:hover { background: #C9F1E2; }
  .ghost {
    background: transparent; color: rgba(253,251,246,.8);
    border: 1px solid rgba(253,251,246,.25);
  }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }
  .note { margin-top: 22px; font-size: 11.5px; color: rgba(253,251,246,.4); }
</style>
</head>
<body>
  <div class="card">
    <div class="ring"><span id="timer">60</span></div>
    <h1>Do you really want to open this?</h1>
    <p>Breathe for a minute. The urge peaks and passes — this is the passing part.</p>
    <div class="host" id="host">this site</div>
    <p style="font-size:12px;margin-top:2px">is on your Quitopia blocklist.</p>

    <div class="actions">
      <a class="btn primary" id="back" href="#">Go back</a>
      <button class="ghost" id="leave" disabled>Continue anyway (60s)</button>
    </div>

    <p class="note">Quitopia never sees what you do next. This screen is the whole intervention.</p>
  </div>

  <script src="block.js"></script>
</body>
</html>
