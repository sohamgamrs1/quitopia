<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blocked — Quitopia</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: Inter, system-ui, sans-serif;
    background: #0F3D2E; color: #FFF8E7; text-align: center;
  }
  .card { max-width: 440px; }
  .ring {
    width: 160px; height: 160px; margin: 0 auto 24px; border-radius: 50%;
    display: grid; place-items: center; font-size: 34px; font-weight: 700;
    background: radial-gradient(circle at 50% 45%, rgba(168,230,207,.35), rgba(168,230,207,.1));
    border: 2px solid rgba(168,230,207,.5);
    animation: breathe 8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(.92); }
    50% { transform: scale(1.04); }
  }
  h1 { font-size: 24px; margin: 0 0 10px; letter-spacing: -0.02em; }
  p { opacity: .75; line-height: 1.6; font-size: 14px; margin: 0 0 8px; }
  .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a.btn {
    border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600;
    font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .primary { background: #A8E6CF; color: #0F3D2E; }
  .ghost { background: transparent; color: #FFF8E7; border: 1px solid rgba(255,248,231,.35); }
</style>
</head>
<body>
  <div class="card">
    <div class="ring" id="timer">60</div>
    <h1>Do you really want to open this?</h1>
    <p id="host">This site is on your blocklist.</p>
    <p>Breathe for a minute. The urge peaks and passes — this is the passing part.</p>
    <div class="actions">
      <a class="btn primary" href="javascript:history.length > 1 ? history.back() : window.close()">Go back</a>
      <button class="btn ghost" id="leave" disabled>Continue anyway (60s)</button>
    </div>
  </div>

  <script src="block.js"></script>
</body>
</html>
