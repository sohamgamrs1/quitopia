<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quitopia Blocker</title>
<style>
  :root {
    --forest: #0B3B2E;
    --forest-600: #1D6B57;
    --mint: #A8E6CF;
    --mint-100: #E2F8EF;
    --cream: #FAF6EC;
    --cream-50: #FDFBF6;
    --muted: #6C7F77;
    --line: rgba(11, 59, 46, 0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 16px;
    font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--cream); color: var(--forest); font-size: 13px;
    letter-spacing: -0.01em;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .mark {
    width: 26px; height: 26px; border-radius: 50%; background: var(--forest);
    display: grid; place-items: center; color: var(--mint); font-size: 13px;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: -0.03em; }
  .sub { margin: 0 0 12px 34px; font-size: 10.5px; color: var(--muted); }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 12px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .row span { font-weight: 600; }
  input[type="text"], input[type="time"], select, textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    font: inherit; font-size: 12px; background: var(--cream-50); color: var(--forest);
    outline: none;
  }
  textarea { min-height: 66px; resize: vertical; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { border-color: var(--forest-600); }
  label.field { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  .switch {
    position: relative; width: 40px; height: 23px; border-radius: 999px; border: 0;
    background: rgba(11, 59, 46, 0.15); cursor: pointer; flex: none; transition: background .18s;
  }
  .switch[aria-checked="true"] { background: var(--forest-600); }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px;
    border-radius: 50%; background: #fff; transition: transform .18s;
  }
  .switch[aria-checked="true"]::after { transform: translateX(17px); }
  button.primary {
    width: 100%; border: 0; border-radius: 999px; padding: 11px; font: inherit;
    font-weight: 700; background: var(--forest); color: var(--cream-50); cursor: pointer;
    margin-top: 10px;
  }
  button.ghost {
    width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 9px;
    font: inherit; font-weight: 600; background: transparent; color: var(--forest);
    cursor: pointer; margin-top: 8px;
  }
  .status {
    display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted);
    margin-top: 4px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2E7D32; }
  .dot.off { background: #B3261E; }
  .hint { font-size: 10.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
  .count { font-size: 10.5px; color: var(--muted); margin-top: 5px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">Q</div>
    <h1>Quitopia Blocker</h1>
  </div>
  <p class="sub">Local only · nothing leaves this browser</p>

  <div class="card">
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking…</span></div>
  </div>

  <div class="card">
    <div class="row"><span>Blocking</span><button class="switch" id="enabled" role="switch" aria-checked="false"></button></div>
    <div class="row"><span>Force safe search</span><button class="switch" id="safeSearch" role="switch" aria-checked="false"></button></div>
    <div class="row"><span>YouTube restricted</span><button class="switch" id="youtubeRestricted" role="switch" aria-checked="false"></button></div>

    <label class="field" for="mode">Mode</label>
    <select id="mode">
      <option value="blocklist">Blocklist — block only my list</option>
      <option value="allowlist">Allowlist — block everything else</option>
      <option value="schedule">Focus hours — block during a window</option>
    </select>
  </div>

  <div class="card">
    <label class="field" for="domains">Blocked domains — one per line</label>
    <textarea id="domains" spellcheck="false"></textarea>
    <div class="count" id="domainCount"></div>

    <label class="field" for="keywords">Blocked keywords</label>
    <textarea id="keywords" spellcheck="false" style="min-height:44px"></textarea>

    <label class="field" for="allowlist">Always allowed</label>
    <textarea id="allowlist" spellcheck="false" style="min-height:44px"></textarea>

    <button class="primary" id="save">Save and apply</button>
  </div>

  <div class="card">
    <label class="field">Focus window</label>
    <div class="row" style="gap:8px">
      <input type="time" id="start" />
      <input type="time" id="end" />
    </div>
    <div class="row"><span>Enable window</span><button class="switch" id="scheduleEnabled" role="switch" aria-checked="false"></button></div>
    <p class="hint">Used by Focus hours mode, and it re-applies every minute on its own.</p>
  </div>

  <div class="card">
    <button class="ghost" id="importBtn">Import from Quitopia (.json)</button>
    <input type="file" id="importFile" accept="application/json" hidden />
    <button class="ghost" id="export">Export settings</button>
    <p class="hint">In the Quitopia app: Blocker → Export for the extension.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
